services:
    app:
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: base/app
        container_name: entrevista_app 
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            DB_CONNECTION: pgsql
            DB_HOST: postgres 
        volumes:
            - '.:/var/www/html'
        networks:
            - ambiente_entrevista
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: 'postgres:14'
        container_name: entrevista_postgres
        environment:
            POSTGRES_USER: '${DB_USERNAME:-postgres}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-postgres}'
            POSTGRES_DB: '${DB_DATABASE:-entrevista}'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        volumes:
            - 'dados_postgres:/var/lib/postgresql/data'
        networks:
            - ambiente_entrevista
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-entrevista}"]
            interval: 5s
            timeout: 5s
            retries: 5

    nginx:
        image: nginx:alpine
        container_name: entrevista_nginx
        ports:
            - '8080:80'
        volumes:
            - '.:/var/www/html'
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf'
        networks:
            - ambiente_entrevista
        depends_on:
            - app

networks:
    ambiente_entrevista:
        driver: bridge

volumes:
    dados_postgres:
        driver: local